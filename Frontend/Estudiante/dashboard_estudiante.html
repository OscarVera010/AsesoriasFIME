<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav id="navbarRol" data-rol="estudiante"></nav>

    <div class="container mt-5 flex-grow-1">
        <div class="row mb-5">
            <div class="col-12 text-center text-md-start">
                <h2 class="fw-bold display-6">¡Hola, <span id="saludoNombre">Estudiante</span>!</h2>
                <p class="text-muted fs-5 mb-0" id="saludoInfo">Matrícula: — | —</p>
                <span class="badge bg-primary mt-2">Sesión activa · Estudiante</span>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <!-- Buscar Tutorías -->
            <div class="col-md-6 col-lg-4">
                <a href="materias.html" class="text-decoration-none">
                    <div class="fime-card fime-card--green card-hover h-100 text-center py-4">
                        <div class="card-body">
                            <div class="mb-2" style="font-size: 2.5rem;"><i class="bi bi-search"></i></div>
                            <h4 class="fw-bold">Buscar Tutorías</h4>
                            <p class="mb-0" style="opacity:.9;">Explora materias y horarios disponibles</p>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Mi Horario (reemplaza "Próxima cita") -->
            <div class="col-md-6 col-lg-4">
                <a href="horario_estudiante.html" class="text-decoration-none">
                    <div class="fime-card card-hover h-100 d-flex flex-column">
                        <div class="card-header-fime px-3 py-2 d-flex justify-content-between align-items-center">
                            <span>Mi Horario</span>
                            <i class="bi bi-calendar-week"></i>
                        </div>
                        <div class="card-body p-4 d-flex flex-column flex-grow-1">
                            <div id="miniHorario" class="flex-grow-1 d-flex flex-column gap-2">
                                <!-- Se llena por JS -->
                            </div>
                            <button class="btn btn-fime-primary btn-sm mt-3 fw-bold">
                                Ver horario completo <i class="bi bi-arrow-right ms-1"></i>
                            </button>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Petición de Materia -->
            <div class="col-md-12 col-lg-4">
                <a href="peticion_materia.html" class="text-decoration-none">
                    <div class="fime-card fime-card--dashed card-hover h-100 text-center py-4">
                        <div class="card-body d-flex flex-column justify-content-center">
                            <div class="mb-2" style="font-size: 2.5rem; color: var(--fime-verde);">
                                <i class="bi bi-journal-plus"></i>
                            </div>
                            <h5 class="fw-bold">¿No encuentras tu materia?</h5>
                            <p class="mb-0 text-muted small">Envía una petición a Jefatura para abrir nuevas tutorías.</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-auto border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function miniHorarioHTML(misAsesorias = []) {
            const cont = document.getElementById('miniHorario');

            if (!misAsesorias.length) {
                cont.innerHTML = `
                    <div class="empty-state py-3">
                        <i class="bi bi-calendar-x"></i>
                        <h5 class="h6 mt-2">Sin asesorías agendadas</h5>
                        <p class="small mb-0">Agenda tu primera tutoría.</p>
                    </div>`;
                return;
            }

            cont.innerHTML = misAsesorias.slice(0, 3).map(a => `
                <div class="d-flex align-items-start gap-2 small">
                    <div style="width: 42px; flex-shrink:0; text-align:center;">
                        <span class="badge bg-primary w-100" style="font-size:.62rem;">
                            ${a.id_turno || a.turno}
                        </span>
                    </div>
                    <div class="flex-grow-1" style="min-width:0;">
                        <div class="fw-bold text-truncate">${a.materia}</div>
                        <div class="text-muted" style="font-size:.72rem;">
                            <i class="bi bi-calendar3 me-1"></i>${a.fecha || a.dia} · ${a.aula || a.hora || ''}
                        </div>
                    </div>
                </div>
            `).join('') + (misAsesorias.length > 3
                ? `<div class="text-center text-muted small mt-1">+${misAsesorias.length - 3} más</div>`
                : '');
        }

        function pintarPerfilEstudiante(u) {
            if (!u) return;
            document.getElementById('saludoNombre').textContent = u.nombre || 'Estudiante';
            document.getElementById('saludoInfo').textContent =
                `Matrícula: ${u.matricula || '—'} | ${u.carrera || '—'}`;
        }

        document.addEventListener('sesionLista', e => pintarPerfilEstudiante(e.detail));

        document.addEventListener('DOMContentLoaded', async () => {
            pintarPerfilEstudiante(obtenerUsuario());
            try {
                const res = await apiFetch('estudiante/citas.php');
                miniHorarioHTML(res.citas || []);
            } catch (err) {
                miniHorarioHTML([]);
            }
        });
    </script>
</body>
</html>
