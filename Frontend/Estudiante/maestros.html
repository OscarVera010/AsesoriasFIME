<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestros - Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav id="navbarRol" data-rol="estudiante" data-badge="Maestros"></nav>

    <div class="container mt-5 flex-grow-1">
        <div class="row mb-5 align-items-end">
            <div class="col-md-8">
                <h2 class="fw-bold">Tutores Disponibles</h2>
                <p class="text-muted mb-0">Busca por nombre o materia y consulta los horarios impartidos por cada tutor.</p>
            </div>
            <div class="col-md-4 mt-3 mt-md-0">
                <div class="input-group">
                    <span class="input-group-text bg-transparent" style="border-color: var(--input-border);">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input id="buscadorMaestros" type="text"
                           class="form-control form-control-custom border-start-0 ps-0"
                           placeholder="Buscar tutor o materia...">
                </div>
            </div>
        </div>

        <div class="row g-4" id="gridMaestros"></div>
    </div>

    <footer class="text-center py-4 mt-5 border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function renderTutores(tutores = []) {
            const grid = document.getElementById('gridMaestros');
            if (!tutores.length) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="fime-card p-5">
                            <div class="empty-state">
                                <i class="bi bi-people"></i>
                                <h5>No hay tutores registrados</h5>
                                <p class="small mb-0">Los tutores activos aprobados por Jefatura aparecerán aquí.</p>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            grid.innerHTML = tutores.map(t => {
                const materias = Array.isArray(t.materias) ? t.materias : [];
                return `
                    <div class="col-md-6 col-lg-4 maestro-card" data-nombre="${t.nombre}" data-materias="${materias.join(' ')}">
                        <div class="fime-card card-hover h-100 p-3">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="avatar-circle me-3">${iniciales(t.nombre)}</div>
                                    <div>
                                        <h5 class="fw-bold mb-0">${t.nombre}</h5>
                                        <span class="text-muted small">Tutor verificado</span>
                                    </div>
                                </div>
                                <p class="text-muted small mb-2">${t.carrera || 'Tutor FIME'}</p>
                                <div class="mb-3">
                                    ${materias.map(m => `<span class="chip-materia">${m}</span>`).join('')}
                                </div>
                                <a href="materias.html?tutor=${encodeURIComponent(t.nombre)}" class="btn btn-fime-primary w-100 fw-bold">Ver horarios</a>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        document.getElementById('buscadorMaestros').addEventListener('input', e => {
            const q = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.maestro-card').forEach(c => {
                const txt = (c.dataset.nombre + ' ' + c.dataset.materias).toLowerCase();
                c.style.display = txt.includes(q) ? '' : 'none';
            });
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await apiFetch('estudiante/tutores.php');
                renderTutores(res.tutores || []);
            } catch (err) {
                renderTutores([]);
                mostrarToast(err.message, 'danger');
            }
        });
    </script>
</body>
</html>
