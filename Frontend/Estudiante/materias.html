<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Horarios Disponibles - Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav id="navbarRol" data-rol="estudiante" data-badge="Materias"></nav>

    <div class="container mt-5 flex-grow-1">
        <div class="row mb-5 align-items-end">
            <div class="col-md-8">
                <h2 class="fw-bold mb-1">Horarios y Asesorías</h2>
                <p class="text-muted mb-0">Filtra por materia, tutor o aula y agenda tu asesoría.</p>
            </div>
            <div class="col-md-4 mt-3 mt-md-0">
                <div class="input-group">
                    <span class="input-group-text bg-transparent" style="border-color: var(--input-border);">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input id="buscadorMaterias" type="text"
                           class="form-control form-control-custom border-start-0 ps-0"
                           placeholder="Buscar materia, tutor o aula...">
                </div>
            </div>
        </div>

        <div class="row g-4" id="gridMaterias"></div>
    </div>

    <!-- Modal Calificar Asesoría -->
    <div class="modal fade" id="modalCalificar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-star-fill text-warning me-2"></i>Calificar Asesoría
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2" id="detalleAsesoriaCalificar"></p>
                    <div class="mt-3">
                        <label class="form-label fw-bold small" for="selectCalifMateria">Puntuación de esta clase y materia (1 a 5 estrellas)</label>
                        <select id="selectCalifMateria" class="form-select">
                            <option value="5">★★★★★ 5 - Excelente</option>
                            <option value="4">★★★★☆ 4 - Muy buena</option>
                            <option value="3">★★★☆☆ 3 - Buena</option>
                            <option value="2">★★☆☆☆ 2 - Regular</option>
                            <option value="1">★☆☆☆☆ 1 - Deficiente</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-fime-primary fw-bold" id="btnGuardarCalifMateria">
                        <i class="bi bi-check-lg me-1"></i>Guardar calificación
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5 border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME - Universidad Autónoma de Nuevo León</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let horariosCache = [];
        let idHorarioCalificar = null;
        const modalCalificar = new bootstrap.Modal(document.getElementById('modalCalificar'));

        function estrellasHTML(promedio) {
            const val = Number(promedio || 0);
            if (!val) return '<span class="text-muted small">Sin calificaciones aún</span>';
            let html = `<span class="rating-value">${val.toFixed(1)}</span>`;
            for (let i = 1; i <= 5; i++) {
                if (val >= i) html += '<i class="bi bi-star-fill"></i>';
                else if (val >= i - 0.5) html += '<i class="bi bi-star-half"></i>';
                else html += '<i class="bi bi-star"></i>';
            }
            return html;
        }

        function renderHorarios(horarios = []) {
            horariosCache = horarios;
            const grid = document.getElementById('gridMaterias');
            if (!horarios.length) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="fime-card p-5">
                            <div class="empty-state">
                                <i class="bi bi-calendar2-x"></i>
                                <h5>No hay horarios disponibles</h5>
                                <p class="small mb-0">Cuando los tutores publiquen horarios aparecerán aquí.</p>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            grid.innerHTML = horarios.map(h => {
                const disponibles = Number(h.plazas_disponibles ?? (h.cupo - (h.inscritos || 0)));
                const agotado = disponibles <= 0;
                const info = `${h.materia} ${h.tutor} ${h.aula} ${agotado ? 'agotado' : 'disponible'}`.toLowerCase();

                let accionHTML = '';
                if (h.ya_inscrito) {
                    const txtCalif = h.mi_calificacion
                        ? `<i class="bi bi-star-fill text-warning me-1"></i>Tu calificación: ${h.mi_calificacion}/5 (Cambiar)`
                        : `<i class="bi bi-star-fill me-1"></i>Calificar esta asesoría`;
                    accionHTML = `
                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <button class="btn btn-outline-success fw-bold flex-fill" disabled>
                                <i class="bi bi-check2-circle me-1"></i>Inscrito en esta asesoría
                            </button>
                            <button class="btn btn-fime-primary fw-bold flex-fill" onclick="abrirModalCalificar(${h.id_horario})">
                                ${txtCalif}
                            </button>
                        </div>`;
                } else if (agotado) {
                    accionHTML = `<button class="btn btn-secondary w-100 fw-bold" disabled>Cupo Agotado (${h.cupo}/${h.cupo})</button>`;
                } else {
                    accionHTML = `<button class="btn btn-fime-primary w-100 fw-bold" onclick="agendarCita(${h.id_horario})">Agendar Cita</button>`;
                }

                return `
                    <div class="col-lg-6 materia-card" data-info="${info}">
                        <div class="fime-card h-100 p-2 ${agotado && !h.ya_inscrito ? 'opacity-75' : ''}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h4 class="fw-bold mb-0 ${agotado && !h.ya_inscrito ? 'text-muted' : ''}">${h.materia}</h4>
                                    <span class="badge ${h.ya_inscrito ? 'text-bg-primary' : (agotado ? 'text-bg-danger' : 'text-bg-success')}">
                                        ${h.ya_inscrito ? 'Inscrito' : (agotado ? 'Agotado' : 'Disponible')}
                                    </span>
                                </div>
                                <div class="rating-stars mb-2">
                                    <span class="text-muted small me-1">Asesoría:</span>
                                    ${estrellasHTML(h.promedio_calificacion)}
                                    ${h.total_resenas ? `<span class="rating-count">(${h.total_resenas})</span>` : ''}
                                </div>
                                <div class="mb-3">
                                    <div class="fw-bold ${agotado && !h.ya_inscrito ? 'text-muted' : 'text-dark'}">
                                        <i class="bi bi-person ${agotado && !h.ya_inscrito ? '' : 'text-primary'} me-1"></i>Tutor: ${h.tutor}
                                    </div>
                                </div>
                                <div class="info-box mb-4">
                                    <p class="mb-1"><i class="bi bi-calendar-event text-muted me-1"></i><strong>Fecha:</strong> ${h.fecha}</p>
                                    <p class="mb-1"><i class="bi bi-clock text-muted me-1"></i><strong>Turno ${h.id_turno}:</strong> ${h.hora_inicio} - ${h.hora_fin}</p>
                                    <p class="mb-1"><i class="bi bi-geo-alt text-muted me-1"></i><strong>Aula:</strong> ${h.aula}</p>
                                    <p class="mb-1"><i class="bi bi-people text-muted me-1"></i><strong>Plazas:</strong> ${disponibles} de ${h.cupo} disponibles</p>
                                    ${h.descripcion ? `<p class="mb-0 text-muted small mt-2"><strong>Descripción:</strong> ${h.descripcion}</p>` : ''}
                                </div>
                                ${accionHTML}
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function abrirModalCalificar(idHorario) {
            const h = horariosCache.find(item => item.id_horario === idHorario);
            if (!h) return;
            idHorarioCalificar = idHorario;
            document.getElementById('detalleAsesoriaCalificar').innerHTML = `
                <strong>${h.materia}</strong><br>
                <span class="text-muted small">
                    Tutor: ${h.tutor} · ${h.fecha} · Turno ${h.id_turno} (${h.hora_inicio} - ${h.hora_fin}) · ${h.aula}
                </span>`;
            document.getElementById('selectCalifMateria').value = String(h.mi_calificacion || 5);
            modalCalificar.show();
        }

        document.getElementById('btnGuardarCalifMateria').addEventListener('click', async () => {
            if (!idHorarioCalificar) return;
            const puntuacion = Number(document.getElementById('selectCalifMateria').value);
            try {
                const res = await apiFetch('estudiante/calificar.php', {
                    method: 'POST',
                    body: { id_horario: idHorarioCalificar, puntuacion }
                });
                modalCalificar.hide();
                idHorarioCalificar = null;
                mostrarToast(res.mensaje || 'Calificación guardada.', 'success');
                await cargarHorarios();
            } catch (err) {
                mostrarToast(err.message, 'danger');
            }
        });

        async function cargarHorarios() {
            try {
                const res = await apiFetch('estudiante/horarios_disponibles.php');
                renderHorarios(res.horarios || []);
                aplicarFiltroBuscador();
            } catch (err) {
                renderHorarios([]);
                mostrarToast(err.message, 'danger');
            }
        }

        async function agendarCita(idHorario) {
            try {
                const res = await apiFetch('estudiante/citas.php', {
                    method: 'POST',
                    body: { id_horario: idHorario }
                });
                mostrarToast(res.mensaje || 'Cita agendada con éxito.', 'success');
                await cargarHorarios();
            } catch (err) {
                mostrarToast(err.message, 'danger');
            }
        }

        function aplicarFiltroBuscador() {
            const q = document.getElementById('buscadorMaterias').value.toLowerCase().trim();
            document.querySelectorAll('.materia-card').forEach(c => {
                c.style.display = c.dataset.info.includes(q) ? '' : 'none';
            });
        }

        document.getElementById('buscadorMaterias').addEventListener('input', aplicarFiltroBuscador);

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const tutorParam = params.get('tutor');
            if (tutorParam) {
                document.getElementById('buscadorMaterias').value = tutorParam;
            }
            cargarHorarios();
        });
    </script>
</body>
</html>
