<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petición de Materia - Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav id="navbarRol" data-rol="estudiante" data-badge="Peticiones"></nav>

    <div class="container mt-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Petición de Nueva Materia</h2>
                    <p class="text-muted">¿No encuentras la materia que buscas? Envíala a Jefatura y buscaremos un tutor.</p>
                </div>

                <div class="card card-fime border-0 shadow-sm p-4 mb-5">
                    <form id="formPeticion">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark" for="petNombreMateria">Nombre de la Materia *</label>
                            <input type="text" class="form-control form-control-custom" id="petNombreMateria" name="nombre_materia"
                                   placeholder="Ej. Álgebra Lineal" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-dark" for="petSemestre">Semestre sugerido</label>
                                <select class="form-select form-select-custom" id="petSemestre" name="semestre">
                                    <option value="">Selecciona...</option>
                                    <option value="1er semestre">1er semestre</option>
                                    <option value="2do semestre">2do semestre</option>
                                    <option value="3er semestre">3er semestre</option>
                                    <option value="4to semestre">4to semestre</option>
                                    <option value="5to semestre">5to semestre</option>
                                    <option value="6to semestre">6to semestre</option>
                                    <option value="7mo semestre">7mo semestre</option>
                                    <option value="8vo semestre">8vo semestre</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-dark" for="petUrgencia">Urgencia</label>
                                <select class="form-select form-select-custom" id="petUrgencia" name="id_urgencia">
                                    <option value="1">Normal</option>
                                    <option value="2">Alta (examen próximo)</option>
                                    <option value="3">Crítica</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark" for="petComentarios">Comentarios para Jefatura (Opcional)</label>
                            <textarea class="form-control form-control-custom" id="petComentarios" name="comentarios" rows="3"
                                      placeholder="Describe brevemente los temas en los que necesitas apoyo..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-fime-primary w-100 fw-bold">
                            <i class="bi bi-send me-1"></i> Enviar Petición a Jefatura
                        </button>
                    </form>
                </div>

                <h5 class="fw-bold text-dark mb-3">Mis peticiones enviadas</h5>
                <div id="listaPeticiones" class="d-flex flex-column gap-2"></div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5 border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
    function renderPeticiones(data = []) {
        const lista = document.getElementById('listaPeticiones');
        if (!data.length) {
            lista.innerHTML = `<div class="text-muted small fst-italic">Aún no has enviado peticiones.</div>`;
            return;
        }
        lista.innerHTML = data.map(p => {
            const estado = (p.estado || 'Pendiente').toLowerCase();
            return `
                <div class="card card-fime border-0 shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <div class="fw-bold text-dark">${p.nombre_materia}</div>
                            <div class="text-muted small">${p.fecha} · Urgencia: ${p.urgencia}</div>
                        </div>
                        <span class="badge ${
                            estado === 'aprobada' ? 'text-bg-success'
                          : estado === 'rechazada' ? 'text-bg-danger'
                          : 'text-bg-warning text-dark'
                        }">${p.estado || 'Pendiente'}</span>
                    </div>
                </div>`;
        }).join('');
    }

    async function cargarPeticiones() {
        try {
            const res = await apiFetch('estudiante/peticiones.php');
            renderPeticiones(res.peticiones || []);
        } catch (err) {
            renderPeticiones([]);
            mostrarToast(err.message, 'danger');
        }
    }

    document.getElementById('formPeticion').addEventListener('submit', async e => {
        e.preventDefault();
        const nombre_materia = document.getElementById('petNombreMateria').value.trim();
        const semestre       = document.getElementById('petSemestre').value;
        const id_urgencia    = Number(document.getElementById('petUrgencia').value || 1);
        const comentarios    = document.getElementById('petComentarios').value.trim();

        if (!nombre_materia) {
            mostrarToast('Ingresa el nombre de la materia', 'danger');
            return;
        }

        try {
            const res = await apiFetch('estudiante/peticiones.php', {
                method: 'POST',
                body: { nombre_materia, semestre, id_urgencia, comentarios }
            });
            e.target.reset();
            mostrarToast(res.mensaje || 'Petición enviada a Jefatura.', 'success');
            await cargarPeticiones();
        } catch (err) {
            mostrarToast(err.message, 'danger');
        }
    });

    document.addEventListener('DOMContentLoaded', cargarPeticiones);
    </script>
</body>
</html>
