<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Tutores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav id="navbarRol" data-rol="admin" data-badge="Tutores"></nav>

    <div class="container mt-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold text-dark">Plantilla de Tutores Activos</h2>
                <p class="text-muted mb-0">Administra los permisos de los tutores.</p>
            </div>
            <input type="text" id="buscadorTutores" class="form-control form-control-custom rounded-pill" style="width: 300px;" placeholder="Buscar tutor o matrícula...">
        </div>

        <div class="card card-fime border-0 shadow-sm p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="background-color: transparent;">
                    <thead style="border-bottom: 2px solid var(--input-border);">
                        <tr>
                            <th class="py-3 px-3 text-dark">Tutor</th>
                            <th class="py-3 px-3 text-dark">Materias Autorizadas</th>
                            <th class="py-3 px-3 text-dark text-center">Estado</th>
                            <th class="py-3 px-3 text-dark text-center">Gestión</th>
                        </tr>
                    </thead>
                    <tbody id="tablaTutores"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Asignar Permisos -->
    <div class="modal fade" id="modalAsignar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content card-fime">
                <div class="modal-header card-header-fime" style="background-color: #dc3545;">
                    <h5 class="modal-title text-white" id="tituloModalPermisos">Autorizar Materias</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formPermisosTutor">
                        <input type="hidden" id="permisoTutorId" value="">
                        <p class="text-muted small">Selecciona las materias que el tutor puede impartir basándote en su Kardex.</p>
                        <div id="listaPermisosMaterias" class="mb-4"></div>
                        <button type="submit" class="btn btn-danger w-100">Guardar Permisos</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let tutoresCache = [];
        let catalogoMaterias = [];

        function renderTutoresAdmin(tutores = []) {
            const tbody = document.getElementById('tablaTutores');
            if (!tutores.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4">
                            <div class="empty-state py-4">
                                <i class="bi bi-people"></i>
                                <h5>No hay tutores registrados</h5>
                                <p class="small mb-0">Aprueba solicitudes de aspirantes para gestionar sus permisos aquí.</p>
                            </div>
                        </td>
                    </tr>`;
                return;
            }
            tbody.innerHTML = tutores.map(t => {
                const activo = Boolean(Number(t.activo));
                const info = `${t.nombre} ${t.matricula}`.toLowerCase();
                return `
                    <tr class="fila-tutor" data-info="${info}">
                        <td class="px-3 text-dark">
                            <span class="fw-bold">${t.nombre}</span><br>
                            <small class="text-muted">${t.matricula}</small>
                        </td>
                        <td class="px-3 text-muted">${(t.materias || []).join(', ') || 'Sin materias'}</td>
                        <td class="px-3 text-center">
                            <span class="badge ${activo ? 'bg-success' : 'bg-secondary'}">${activo ? 'Activo' : 'Suspendido'}</span>
                        </td>
                        <td class="px-3 text-center">
                            <button class="btn btn-primary btn-sm mx-1" onclick="abrirPermisos(${t.id_usuario})">Permisos</button>
                            <button class="btn btn-warning btn-sm mx-1" onclick="toggleSuspension(${t.id_usuario}, ${activo ? 0 : 1})">
                                ${activo ? 'Suspender' : 'Reactivar'}
                            </button>
                            <button class="btn btn-outline-danger btn-sm mx-1" onclick="darDeBaja(${t.id_usuario}, '${t.nombre}')">Dar de Baja</button>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function cargarTutoresAdmin() {
            try {
                const [resTutores, resCatalogo] = await Promise.all([
                    apiFetch('admin/tutores.php'),
                    apiFetch('admin/catalogo.php')
                ]);
                tutoresCache = resTutores.tutores || [];
                catalogoMaterias = resCatalogo.materias || [];
                renderTutoresAdmin(tutoresCache);
            } catch (err) {
                renderTutoresAdmin([]);
                mostrarToast(err.message, 'danger');
            }
        }

        function abrirPermisos(idTutor) {
            const tutor = tutoresCache.find(t => Number(t.id_usuario) === Number(idTutor));
            if (!tutor) return;
            const idsActuales = new Set((tutor.materias_ids || []).map(Number));
            document.getElementById('permisoTutorId').value = tutor.id_usuario;
            document.getElementById('tituloModalPermisos').textContent = `Autorizar Materias (${tutor.nombre})`;
            const cont = document.getElementById('listaPermisosMaterias');
            if (!catalogoMaterias.length) {
                cont.innerHTML = '<div class="text-muted small">No hay materias en el catálogo.</div>';
            } else {
                cont.innerHTML = catalogoMaterias.map(m => `
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="permiso_materia[]"
                               value="${m.id_materia}" id="perm_${m.id_materia}"
                               ${idsActuales.has(Number(m.id_materia)) ? 'checked' : ''}>
                        <label class="form-check-label text-dark fw-bold" for="perm_${m.id_materia}">${m.nombre}</label>
                    </div>
                `).join('');
            }
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalAsignar')).show();
        }

        document.getElementById('formPermisosTutor').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id_tutor = Number(document.getElementById('permisoTutorId').value);
            const materias = Array.from(document.querySelectorAll('input[name="permiso_materia[]"]:checked'))
                .map(el => Number(el.value));

            try {
                const res = await apiFetch('admin/tutores.php', {
                    method: 'PUT',
                    body: { accion: 'permisos', id_tutor, materias }
                });
                bootstrap.Modal.getOrCreateInstance(document.getElementById('modalAsignar')).hide();
                mostrarToast(res.mensaje || 'Permisos guardados.', 'success');
                await cargarTutoresAdmin();
            } catch (err) {
                mostrarToast(err.message, 'danger');
            }
        });

        async function toggleSuspension(idTutor, nuevoEstado) {
            try {
                const res = await apiFetch('admin/tutores.php', {
                    method: 'PUT',
                    body: { accion: 'estado', id_tutor: idTutor, activo: nuevoEstado }
                });
                mostrarToast(res.mensaje || 'Estado actualizado.', 'success');
                await cargarTutoresAdmin();
            } catch (err) {
                mostrarToast(err.message, 'danger');
            }
        }

        async function darDeBaja(idTutor, nombre) {
            if (!confirm(`¿Dar de baja a ${nombre} como tutor? Regresará a rol Estudiante y se eliminarán sus horarios.`)) return;
            try {
                const res = await apiFetch('admin/tutores.php', {
                    method: 'DELETE',
                    body: { id_tutor: idTutor }
                });
                mostrarToast(res.mensaje || 'Tutor dado de baja.', 'success');
                await cargarTutoresAdmin();
            } catch (err) {
                mostrarToast(err.message, 'danger');
            }
        }

        document.getElementById('buscadorTutores').addEventListener('input', e => {
            const q = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.fila-tutor').forEach(tr => {
                tr.style.display = tr.dataset.info.includes(q) ? '' : 'none';
            });
        });

        document.addEventListener('DOMContentLoaded', cargarTutoresAdmin);
    </script>
</body>
</html>
