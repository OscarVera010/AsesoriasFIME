<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tutor - Asesorías FIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    
    <nav id="navbarRol" data-rol="estudiante" data-badge="Solicitud de Tutor"></nav>

    <div class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-fime shadow border-0">
                    <div class="card-header card-header-fime text-center py-3 rounded-top">
                        <h4 class="mb-0 text-white">Solicitud para ser Tutor</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted text-center mb-4">
                            Tus datos se toman de tu sesión activa. Selecciona las materias y adjunta tu Kardex para revisión de Jefatura.
                        </p>

                        <form id="formSolicitudTutor" enctype="multipart/form-data" novalidate>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-dark" for="solNombre">Nombre Completo</label>
                                    <input type="text" class="form-control form-control-custom" id="solNombre"
                                           placeholder="—" readonly>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-dark" for="solMatricula">Matrícula</label>
                                    <input type="text" class="form-control form-control-custom" id="solMatricula"
                                           placeholder="—" readonly>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark" for="solCarrera">Carrera</label>
                                <input type="text" class="form-control form-control-custom" id="solCarrera"
                                       placeholder="—" readonly>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold mb-3 text-dark">¿Qué materias deseas impartir?</label>
                                <div class="card p-3 shadow-sm border bg-light" style="border-color: var(--input-border) !important;">
                                    <div class="row" id="contenedorMateriasSolicitud">
                                        <div class="col-12 text-muted small fst-italic">
                                            Las materias disponibles se cargarán desde el catálogo oficial.
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark" for="solKardex">Evidencia Académica (Kardex)</label>
                                <input class="form-control form-control-custom" type="file" id="solKardex" name="kardex"
                                       accept=".pdf,application/pdf" required>
                                <div class="form-text text-muted small mt-1">
                                    Formato PDF. Máx. 5 MB.
                                </div>
                            </div>

                            <button type="submit" class="btn btn-fime-primary w-100 py-2 mt-2">
                                <i class="bi bi-send me-1"></i> Enviar Solicitud a Revisión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-auto border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME - Universidad Autónoma de Nuevo León</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        function renderMateriasSolicitud(materias = []) {
            const cont = document.getElementById('contenedorMateriasSolicitud');
            if (!materias.length) {
                cont.innerHTML = `<div class="col-12 text-muted small fst-italic">No hay materias disponibles en el catálogo.</div>`;
                return;
            }
            cont.innerHTML = materias.map(m => `
                <div class="col-md-6">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="materias[]" value="${m.id_materia}" id="mat_${m.id_materia}">
                        <label class="form-check-label text-dark" for="mat_${m.id_materia}">${m.nombre}</label>
                    </div>
                </div>
            `).join('');
        }

        function llenarDatosUsuario(u) {
            if (!u) return;
            document.getElementById('solNombre').value = u.nombre || '';
            document.getElementById('solMatricula').value = u.matricula || '';
            document.getElementById('solCarrera').value = u.carrera || '';
        }

        document.addEventListener('sesionLista', e => llenarDatosUsuario(e.detail));

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.sesionPromise) {
                const u = await window.sesionPromise;
                llenarDatosUsuario(u);
            }
            try {
                const res = await apiFetch('catalogos/materias.php');
                renderMateriasSolicitud(res.materias || []);
            } catch (err) {
                renderMateriasSolicitud([]);
                mostrarToast(err.message, 'danger');
            }
        });

        document.getElementById('formSolicitudTutor').addEventListener('submit', async function(e) {
            e.preventDefault();
            const materias = Array.from(document.querySelectorAll('input[name="materias[]"]:checked')).map(el => el.value);
            const kardex = document.getElementById('solKardex').files[0];

            if (!materias.length) {
                mostrarToast('Selecciona al menos una materia para impartir', 'danger');
                return;
            }
            if (!kardex || kardex.type !== 'application/pdf' || kardex.size > 5 * 1024 * 1024) {
                mostrarToast('Adjunta tu Kardex en formato PDF (máx. 5 MB)', 'danger');
                return;
            }

            const formData = new FormData();
            materias.forEach(id => formData.append('materias[]', id));
            formData.append('kardex', kardex);

            try {
                const res = await apiFetch('auth/solicitud_tutor.php', {
                    method: 'POST',
                    body: formData
                });
                mostrarToast(res.mensaje || 'Solicitud enviada a revisión.', 'success');
                setTimeout(() => window.location.href = 'Estudiante/dashboard_estudiante.html', 1500);
            } catch (err) {
                mostrarToast(err.message, 'danger');
            }
        });
    </script>
</body>
</html>
