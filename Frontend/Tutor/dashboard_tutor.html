<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tutor - Asesorías FIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav id="navbarRol" data-rol="tutor"></nav>

    <div class="container mt-5 flex-grow-1">
        <div class="row mb-5">
            <div class="col-12 text-center text-md-start">
                <span class="badge text-bg-success mb-2">Cuenta Verificada</span>
                <h2 class="fw-bold display-6">Bienvenido, <span id="nombreTutor">Tutor</span></h2>
                <p class="text-muted fs-5" id="infoTutor">Programa: —</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <a href="tutor_alumnos.html" class="text-decoration-none">
                    <div class="fime-card card-hover h-100 text-center py-5">
                        <div class="card-body">
                            <h1 class="display-4 fw-bold" id="totalCitasSemana" style="color: var(--fime-verde);">0</h1>
                            <h4 class="fw-bold">Mis Alumnos</h4>
                            <p class="text-muted mb-0">Citas confirmadas para esta semana</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="crud_materias.html" class="text-decoration-none">
                    <div class="fime-card card-hover h-100 text-center py-5">
                        <div class="card-body">
                            <div class="mb-3" style="font-size: 3rem; color: var(--fime-azul);">
                                <i class="bi bi-journal-bookmark"></i>
                            </div>
                            <h4 class="fw-bold">Gestión de Materias</h4>
                            <p class="text-muted mb-0">Publica los temas que ofreces</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="crud_horarios.html" class="text-decoration-none">
                    <div class="fime-card card-hover h-100 text-center py-5">
                        <div class="card-body">
                            <div class="mb-3" style="font-size: 3rem; color: var(--fime-amarillo);">
                                <i class="bi bi-clock-history"></i>
                            </div>
                            <h4 class="fw-bold">Gestión de Horarios</h4>
                            <p class="text-muted mb-0">Abre tu disponibilidad</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5 border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function pintarTutor(u) {
            if (!u) return;
            document.getElementById('nombreTutor').textContent = u.nombre || 'Tutor';
            document.getElementById('infoTutor').textContent = 'Programa: ' + (u.carrera || '—');
        }

        document.addEventListener('sesionLista', e => pintarTutor(e.detail));

        document.addEventListener('DOMContentLoaded', async () => {
            pintarTutor(obtenerUsuario());
            try {
                const res = await apiFetch('tutor/alumnos_asistencia.php');
                document.getElementById('totalCitasSemana').textContent = res.total_citas ?? 0;
            } catch (err) {}
        });
    </script>
</body>
</html>
