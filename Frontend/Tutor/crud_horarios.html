<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Horarios - Tutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav id="navbarRol" data-rol="tutor" data-badge="Gestión de Horarios"></nav>

    <div class="container mt-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold text-dark mb-1">Disponibilidad de Horarios y Cupos</h2>
                <p class="text-muted mb-0">Define tus sesiones con límite de alumnos por aula.</p>
            </div>
            <button class="btn btn-fime-primary" onclick="abrirModalNuevoHorario()">
                <i class="bi bi-calendar-plus me-1"></i> Abrir Nuevo Horario
            </button>
        </div>

        <div class="card card-fime border-0 shadow-sm p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="background-color: transparent;">
                    <thead style="border-bottom: 2px solid var(--input-border);">
                        <tr>
                            <th class="py-3 px-3 text-dark">Día y Turno FIME</th>
                            <th class="py-3 px-3 text-dark">Materia Asignada</th>
                            <th class="py-3 px-3 text-dark">Aula</th>
                            <th class="py-3 px-3 text-dark">Cupo / Inscritos</th>
                            <th class="py-3 px-3 text-dark text-center">Estado</th>
                            <th class="py-3 px-3 text-dark text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHorariosTutor"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal CREATE Horario -->
    <div class="modal fade" id="modalCrearHorario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content card-fime">
                <div class="modal-header card-header-fime">
                    <h5 class="modal-title text-white" id="tituloModalHorario">Abrir Nuevo Horario de Asesoría</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formHorario">
                        <input type="hidden" id="horarioIdInput" name="id_horario" value="">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-dark" for="fechaInput">Fecha</label>
                                <input type="date" class="form-control form-control-custom" id="fechaInput" name="fecha" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-dark" for="turnoInput">Turno FIME</label>
                                <select class="form-select form-select-custom" id="turnoInput" name="id_turno" required>
                                    <option value="" disabled selected>Selecciona turno...</option>
                                    <optgroup label="Matutino">
                                        <option value="M1">M1 (7:00 AM - 7:50 AM)</option>
                                        <option value="M2">M2 (7:50 AM - 8:40 AM)</option>
                                        <option value="M3">M3 (8:40 AM - 9:30 AM)</option>
                                        <option value="M4">M4 (9:30 AM - 10:20 AM)</option>
                                        <option value="M5">M5 (10:20 AM - 11:10 AM)</option>
                                        <option value="M6">M6 (11:10 AM - 12:00 PM)</option>
                                    </optgroup>
                                    <optgroup label="Vespertino">
                                        <option value="V1">V1 (12:00 PM - 12:50 PM)</option>
                                        <option value="V2">V2 (12:50 PM - 1:40 PM)</option>
                                        <option value="V3">V3 (1:40 PM - 2:30 PM)</option>
                                        <option value="V4">V4 (2:30 PM - 3:20 PM)</option>
                                        <option value="V5">V5 (3:20 PM - 4:10 PM)</option>
                                        <option value="V6">V6 (4:10 PM - 5:00 PM)</option>
                                    </optgroup>
                                    <optgroup label="Nocturno">
                                        <option value="N1">N1 (5:00 PM - 5:45 PM)</option>
                                        <option value="N2">N2 (5:45 PM - 6:30 PM)</option>
                                        <option value="N3">N3 (6:30 PM - 7:15 PM)</option>
                                        <option value="N4">N4 (7:15 PM - 8:00 PM)</option>
                                        <option value="N5">N5 (8:00 PM - 8:45 PM)</option>
                                        <option value="N6">N6 (8:45 PM - 9:30 PM)</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark" for="materiaHorarioInput">Materia a impartir (Autorizadas)</label>
                            <select class="form-select form-select-custom" id="materiaHorarioInput" name="id_materia" required>
                                <option value="" disabled selected>Selecciona materia...</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold text-dark" for="aulaInput">Aula / Salón FIME</label>
                                <select class="form-select form-select-custom" id="aulaInput" required>
                                    <option value="" disabled selected>Selecciona salón (Edif-Piso-Salón)...</option>
                                    <optgroup label="Edificio 1 (1er dígito = 1)">
                                        <option value="Aula 1101">1101 (Edif. 1 · Piso 1 · Salón 01)</option>
                                        <option value="Aula 1102">1102 (Edif. 1 · Piso 1 · Salón 02)</option>
                                        <option value="Aula 1201">1201 (Edif. 1 · Piso 2 · Salón 01)</option>
                                        <option value="Aula 1204">1204 (Edif. 1 · Piso 2 · Salón 04)</option>
                                        <option value="Aula 1302">1302 (Edif. 1 · Piso 3 · Salón 02)</option>
                                    </optgroup>
                                    <optgroup label="Edificio 2 (1er dígito = 2)">
                                        <option value="Aula 2101">2101 (Edif. 2 · Piso 1 · Salón 01)</option>
                                        <option value="Aula 2203">2203 (Edif. 2 · Piso 2 · Salón 03)</option>
                                        <option value="Aula 2204">2204 (Edif. 2 · Piso 2 · Salón 04)</option>
                                        <option value="Aula 2301">2301 (Edif. 2 · Piso 3 · Salón 01)</option>
                                    </optgroup>
                                    <optgroup label="Edificio 3 (1er dígito = 3)">
                                        <option value="Aula 3101">3101 (Edif. 3 · Piso 1 · Salón 01)</option>
                                        <option value="Aula 3105">3105 (Edif. 3 · Piso 1 · Salón 05)</option>
                                        <option value="Aula 3204">3204 (Edif. 3 · Piso 2 · Salón 04)</option>
                                        <option value="Aula 3306">3306 (Edif. 3 · Piso 3 · Salón 06)</option>
                                    </optgroup>
                                    <optgroup label="Edificio 4 (1er dígito = 4)">
                                        <option value="Aula 4101">4101 (Edif. 4 · Piso 1 · Salón 01)</option>
                                        <option value="Aula 4105">4105 (Edif. 4 · Piso 1 · Salón 05)</option>
                                        <option value="Aula 4201">4201 (Edif. 4 · Piso 2 · Salón 01)</option>
                                        <option value="Aula 4206">4206 (Edif. 4 · Piso 2 · Salón 06)</option>
                                    </optgroup>
                                    <optgroup label="Edificio 6 (1er dígito = 6)">
                                        <option value="Aula 6201">6201 (Edif. 6 · Piso 2 · Salón 01)</option>
                                        <option value="Aula 6304">6304 (Edif. 6 · Piso 3 · Salón 04)</option>
                                    </optgroup>
                                    <optgroup label="Edificio 7 (1er dígito = 7)">
                                        <option value="Aula 7101">7101 (Edif. 7 · Piso 1 · Salón 01)</option>
                                        <option value="Aula 7203">7203 (Edif. 7 · Piso 2 · Salón 03)</option>
                                    </optgroup>
                                    <optgroup label="Edificio 9 (1er dígito = 9)">
                                        <option value="Aula 9101">9101 (Edif. 9 · Piso 1 · Salón 01)</option>
                                        <option value="Aula 9201">9201 (Edif. 9 · Piso 2 · Salón 01)</option>
                                        <option value="Aula 9203">9203 (Edif. 9 · Piso 2 · Salón 03)</option>
                                        <option value="Aula 9204">9204 (Edif. 9 · Piso 2 · Salón 04)</option>
                                        <option value="Aula 9302">9302 (Edif. 9 · Piso 3 · Salón 02)</option>
                                    </optgroup>
                                </select>
                                <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">Nomenclatura FIME: 1er dígito = Edificio, 2do = Piso, 3er-4to = Salón (ej. 9203).</small>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold text-dark" for="cupoInput">Cupo Máximo (1 a 3 alumnos)</label>
                                <input type="number" class="form-control form-control-custom" id="cupoInput" name="cupo" min="1" max="3" value="3" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-fime-primary w-100 fw-bold">Guardar Horario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5 border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
    function renderHorariosTutor(horarios = []) {
        const tbody = document.getElementById('tablaHorariosTutor');
        if (!horarios.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state py-4">
                            <i class="bi bi-calendar-x"></i>
                            <h5>No tienes horarios publicados</h5>
                            <p class="small mb-0">Haz clic en "Abrir Nuevo Horario" para publicar una sesión.</p>
                        </div>
                    </td>
                </tr>`;
            return;
        }
        tbody.innerHTML = horarios.map(h => {
            const inscritos = Number(h.inscritos || 0);
            const cupo = Number(h.cupo || 1);
            const pct = Math.min(100, Math.round((inscritos / cupo) * 100));
            const agotado = inscritos >= cupo;
            return `
                <tr>
                    <td class="px-3 text-dark">
                        <span class="fw-bold">${h.fecha}</span><br>
                        <small class="text-muted">Turno ${h.id_turno} (${h.hora_inicio} - ${h.hora_fin})</small>
                    </td>
                    <td class="px-3 fw-bold text-dark">${h.materia}</td>
                    <td class="px-3 text-dark"><span class="badge bg-light text-dark border">${h.aula}</span></td>
                    <td class="px-3">
                        <span class="fw-bold ${agotado ? 'text-danger' : 'text-primary'}">${inscritos} / ${cupo} alumnos</span>
                        <div class="progress mt-1" style="height: 6px; width: 100px;">
                            <div class="progress-bar ${agotado ? 'bg-danger' : 'bg-primary'}" role="progressbar" style="width: ${pct}%;"></div>
                        </div>
                    </td>
                    <td class="px-3 text-center">
                        <span class="badge ${agotado ? 'text-bg-danger' : 'text-bg-success'}">${agotado ? 'Agotado' : 'Disponible'}</span>
                    </td>
                    <td class="px-3 text-center">
                        <button class="btn btn-outline-secondary btn-sm mx-1" onclick='editarHorario(${JSON.stringify(h)})'>
                            <i class="bi bi-pencil me-1"></i> Editar
                        </button>
                        ${inscritos > 0
                            ? `<button class="btn btn-outline-danger btn-sm mx-1" onclick="cancelarClase(${h.id_horario}, '${h.materia}')">
                                   <i class="bi bi-x-circle me-1"></i> Cancelar clase
                               </button>`
                            : `<button class="btn btn-outline-danger btn-sm mx-1" onclick="eliminarHorarioLibre(${h.id_horario})">
                                   <i class="bi bi-trash me-1"></i> Eliminar Horario
                               </button>`}
                    </td>
                </tr>`;
        }).join('');
    }

    function renderMateriasSelect(materias = []) {
        const select = document.getElementById('materiaHorarioInput');
        select.innerHTML = `<option value="" disabled selected>Selecciona materia...</option>` +
            materias.map(m => `<option value="${m.id_materia}">${m.nombre}</option>`).join('');
    }

    function abrirModalNuevoHorario() {
        document.getElementById('formHorario').reset();
        document.getElementById('horarioIdInput').value = '';
        document.getElementById('tituloModalHorario').textContent = 'Abrir Nuevo Horario de Asesoría';
        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalCrearHorario')).show();
    }

    function editarHorario(h) {
        document.getElementById('horarioIdInput').value = h.id_horario;
        document.getElementById('fechaInput').value = h.fecha;
        document.getElementById('turnoInput').value = h.id_turno;
        document.getElementById('materiaHorarioInput').value = h.id_materia;
        document.getElementById('aulaInput').value = h.aula;
        document.getElementById('cupoInput').value = h.cupo;
        document.getElementById('tituloModalHorario').textContent = 'Editar Horario de Asesoría';
        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalCrearHorario')).show();
    }

    async function cargarHorariosTutor() {
        try {
            const res = await apiFetch('tutor/horarios.php');
            renderHorariosTutor(res.horarios || []);
            renderMateriasSelect(res.materias_publicadas || []);
        } catch (err) {
            renderHorariosTutor([]);
            renderMateriasSelect([]);
            mostrarToast(err.message, 'danger');
        }
    }

    document.getElementById('formHorario').addEventListener('submit', async function(e) {
        e.preventDefault();
        const idHorario = document.getElementById('horarioIdInput').value;
        const payload = {
            id_horario: idHorario ? Number(idHorario) : 0,
            fecha:      document.getElementById('fechaInput').value,
            id_turno:   document.getElementById('turnoInput').value,
            id_materia: Number(document.getElementById('materiaHorarioInput').value),
            aula:       document.getElementById('aulaInput').value,
            cupo:       Number(document.getElementById('cupoInput').value)
        };

        try {
            const res = await apiFetch('tutor/horarios.php', {
                method: idHorario ? 'PUT' : 'POST',
                body: payload
            });
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalCrearHorario')).hide();
            mostrarToast(res.mensaje || 'Horario guardado.', 'success');
            await cargarHorariosTutor();
        } catch (err) {
            mostrarToast(err.message, 'danger');
        }
    });

    async function cancelarClase(idHorario, materia) {
        if (!confirm(`¿Deseas cancelar la clase de ${materia}? Se cancelarán las citas de los alumnos inscritos.`)) return;
        try {
            const res = await apiFetch('tutor/horarios.php', {
                method: 'DELETE',
                body: { id_horario: idHorario }
            });
            mostrarToast(res.mensaje || 'Clase cancelada.', 'success');
            await cargarHorariosTutor();
        } catch (err) {
            mostrarToast(err.message, 'danger');
        }
    }

    async function eliminarHorarioLibre(idHorario) {
        if (!confirm('¿Eliminar este horario?')) return;
        try {
            const res = await apiFetch('tutor/horarios.php', {
                method: 'DELETE',
                body: { id_horario: idHorario }
            });
            mostrarToast(res.mensaje || 'Horario eliminado.', 'success');
            await cargarHorariosTutor();
        } catch (err) {
            mostrarToast(err.message, 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', cargarHorariosTutor);
    </script>
</body>
</html>
