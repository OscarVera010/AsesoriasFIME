<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa del Campus - Asesorías FIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    
    <nav id="navbarRol" data-rol="public" data-badge="Mapa"></nav>

    <div class="container mt-5 text-center flex-grow-1">
        <h2 class="fw-bold mb-4 text-dark">Ubicaciones de Tutorías en FIME</h2>
        <p class="text-muted mb-4">Las sesiones presenciales suelen llevarse a cabo en la biblioteca o áreas comunes marcadas en este mapa.</p>
        <div class="card card-fime shadow border-0 mx-auto" style="max-width: 850px;">
            <div class="card-body p-3">
                <div class="bg-light d-flex align-items-center justify-content-center" style="height: 500px; border-radius: 8px; border: 1px solid var(--input-border); overflow: hidden; padding: 12px;">
                    <img src="img/mapa.jpg" class="rounded shadow-sm" style="max-width: 100%; max-height: 100%; object-fit: contain;" alt="Mapa del campus FIME">
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-auto border-top" style="border-color: var(--input-border);">
        <p class="text-muted small mb-0">© 2026 Asesorías FIME - Universidad Autónoma de Nuevo León</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
